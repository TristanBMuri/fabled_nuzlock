[project]
name = "nuzlock-rl"
version = "0.1.0"
description = "Nuzlocke gauntlet RL — minimal rebuild"
requires-python = ">=3.11"
dependencies = [
    "poke-env>=0.15.0",
    "gymnasium<1.2.3",
    "numpy",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
