[project]
name = "nuzlock-rl"
version = "0.1.0"
description = "Nuzlocke gauntlet RL — minimal rebuild"
requires-python = ">=3.11"
dependencies = [
    "poke-env>=0.15.0",
    "gymnasium<1.2.3",
    "numpy",
    "poke-engine>=0.0.48",
    "poke-engine-rr",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# poke-engine: our fork (poke-engine/, gitignored, branch nuzlock; README -> Setup). Two builds
# of it: poke_engine = Gen 8 (the PyPI wheel is Gen 4), poke_engine_rr = Radical Red (feature
# `rr`); each package's Cargo.toml picks its features. Needs cargo; a rebuild is ~30 s.

[tool.uv.sources]
poke-engine = { path = "poke-engine/poke-engine-py" }
poke-engine-rr = { path = "poke-engine/poke-engine-py-rr" }
