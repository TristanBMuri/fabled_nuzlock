[project]
name = "nuzlock-rl"
version = "0.1.0"
description = "Nuzlocke gauntlet RL — minimal rebuild"
requires-python = ">=3.11"
dependencies = [
    "poke-env>=0.15.0",
    "gymnasium<1.2.3",
    "numpy",
    "poke-engine>=0.0.48",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# poke-engine: our fork (poke-engine/, gitignored, branch nuzlock; README -> Setup), built
# as Gen 8 (the PyPI wheel is Gen 4). Needs cargo; a rebuild after an edit is ~30 s.
config-settings = { build-args = "--no-default-features --features poke-engine/gen8" }

[tool.uv.sources]
poke-engine = { path = "poke-engine/poke-engine-py" }
