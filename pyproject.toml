[project]
name = "nuzlock-rl"
version = "0.1.0"
description = "Nuzlocke gauntlet RL — minimal rebuild"
requires-python = ">=3.11"
dependencies = [
    "poke-env>=0.15.0",
    "gymnasium<1.2.3",
    "numpy",
    "poke-engine>=0.0.48",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# poke-engine's PyPI wheel is a Gen 4 build; build Gen 8 from the sdist (needs cargo, ~10 s)
no-binary-package = ["poke-engine"]
config-settings = { build-args = "--no-default-features --features poke-engine/gen8" }
