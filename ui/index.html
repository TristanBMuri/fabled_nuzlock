<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuzlocke runs</title>
<!-- UI_TODO.md: fed by ui/build.py (data.json); served with `uv run python ui/build.py --serve` -->
<style>
:root {
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --line: #dddcd6;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #85837d;
  --blue: #2a78d6; --red: #d03b3b; --mid: #f0efec;
  --good: #0ca30c; --warn: #c98500; --bad: #d03b3b;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #353532;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8d8c84;
  --blue: #3987e5; --red: #e66767; --mid: #383835;
  --good: #2bbf2b; --warn: #fab219; --bad: #e66767;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; }
header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 4px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; }
nav a.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.status { margin-left: auto; color: var(--ink-3); font-size: 12px; display: flex; gap: 12px; align-items: center; }
main { padding: 16px; max-width: 1500px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
.card > .head { padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; }
.card > .body { border-top: 1px solid var(--line); padding: 12px 14px; }
.row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.name { font-weight: 600; font-family: var(--mono); }
.muted { color: var(--ink-3); } .small { font-size: 12px; } .mono { font-family: var(--mono); }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; font-weight: 600; }
.pill.running { color: var(--good); } .pill.done { color: var(--ink-2); } .pill.stopped { color: var(--warn); } .pill.failed { color: var(--bad); }
.chip { font-size: 11px; font-family: var(--mono); background: var(--surface-2); border-radius: 4px; padding: 1px 6px; color: var(--ink-2); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stats > div > .muted { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.boss { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; }
.boss > .bh { padding: 10px 12px; background: var(--surface-2); border-radius: 8px 8px 0 0; display: grid; gap: 4px; }
.boss > .bb { padding: 10px 12px; display: grid; gap: 12px; }
h3 { margin: 0; font-size: 14px; } h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--ink); }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
tr.best td { font-weight: 600; } tr.detail > td { background: var(--bg); padding: 10px 12px; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.set { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.set b { font-size: 13px; }
.hbars { display: grid; grid-template-columns: minmax(80px, max-content) 1fr max-content; gap: 2px 8px; align-items: center; font-size: 12px; }
.hbars .bar { height: 10px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
button, select { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
button:hover { background: var(--surface-2); }
.up { color: var(--good); } .down { color: var(--bad); }
/* matrix */
.mx { border-collapse: separate; border-spacing: 2px; width: auto; }
.mx th, .mx td { border: 0; }
.mx td.c { font-family: var(--mono); font-size: 12px; text-align: center; min-width: 64px; border-radius: 4px; padding: 6px 4px; }
.mx td.c.safe { box-shadow: inset 0 0 0 2px var(--ink); font-weight: 700; }
.mx td.c.race { box-shadow: inset 0 0 0 1px var(--ink-2); }
.mx th.e { vertical-align: bottom; font-weight: 400; color: var(--ink); max-width: 130px; white-space: normal; }
.mx th.o { font-weight: 400; color: var(--ink); white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
/* trace */
.turn { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.turn.death { border-left: 3px solid var(--bad); padding-left: 8px; }
.tno { font-family: var(--mono); font-weight: 600; color: var(--ink-2); }
.tno a { color: var(--blue); font-weight: 400; text-decoration: none; white-space: nowrap; }
.act { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.hp { display: grid; gap: 2px; font-size: 12px; } .hp .bar { height: 8px; }
.cand { display: grid; grid-template-columns: minmax(110px, max-content) 1fr 1fr 4em; gap: 2px 0; align-items: center; font-size: 12px; font-family: var(--mono); margin-top: 6px; }
.cand .neg, .cand .pos { height: 10px; } .cand .neg { display: flex; justify-content: flex-end; border-right: 1px solid var(--ink-3); }
.cand .neg i { background: var(--red); display: block; height: 100%; border-radius: 3px 0 0 3px; }
.cand .pos i { background: var(--blue); display: block; height: 100%; border-radius: 0 3px 3px 0; }
.cand .pick { font-weight: 700; }
.ev { font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin-top: 6px; display: grid; gap: 1px; }
.ev .f { color: var(--bad); font-weight: 600; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); max-width: min(96vw, 1400px); padding: 14px; }
dialog::backdrop { background: rgb(0 0 0 / .4); }
.empty { color: var(--ink-3); padding: 24px; text-align: center; }
/* gauntlet (BDSP planner) */
.strip { position: relative; height: 14px; background: var(--surface-2); border-radius: 3px; min-width: 200px; }
.strip > .p { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); opacity: .45; border-radius: 3px; }
.strip > .p.clear { background: var(--good); }
.strip > .m { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); opacity: .6; }
.strip > .d { position: absolute; top: 1px; bottom: 1px; width: 3px; margin-left: -1px; background: var(--bad); border-radius: 1px; }
.eps td { vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Nuzlocke runs</h1>
  <nav id="tabs"></nav>
  <div class="status"><label><input type="checkbox" id="hist"> results/ (history)</label><span id="stamp">loading…</span></div>
</header>
<main id="main"></main>
<dialog id="dlg"><div class="row" style="justify-content:space-between"><h3 id="dlgt"></h3><button data-act="close">close</button></div><div id="dlgb" style="margin-top:10px"></div></dialog>
<script>
const TABS = [["runs", "Runs"], ["compare", "Compare"], ["deaths", "Deaths"], ["traces", "Traces"], ["matrices", "Matrices"]];
const S = { data: null, open: new Set(), sort: {}, cmp: [null, null], matrix: null, hist: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
const f2 = x => x == null ? "–" : x.toFixed(2);
const toId = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const ago = t => { const m = (Date.now() / 1000 - t) / 60; return m < 1 ? "just now" : m < 90 ? `${Math.round(m)} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const when = t => t ? new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";
const tab = () => (location.hash.slice(1) || "runs");
const bar = (frac, title = "") => `<div class="bar" title="${esc(title)}"><i style="width:${Math.max(0, Math.min(1, frac)) * 100}%"></i></div>`;
const hbars = (rows, max) => `<div class="hbars">${rows.map(([l, v, txt]) => `<span>${esc(l)}</span>${bar(max ? v / max : 0)}<span class="muted mono">${esc(txt ?? v)}</span>`).join("")}</div>`;
const runs = () => (S.data?.runs || []).filter(r => S.hist || r.where === "logs");
const runById = id => (S.data?.runs || []).find(r => r.id === id);

function setHTML(sets, mark = new Set()) {
  return `<div class="sets">${(sets || []).map(s => `<div class="set"><b>${esc(s.species)}</b>${mark.has(s.species) ? " ★" : ""}
    <span class="muted">${esc(s.level ? "L" + s.level + " " : "")}${esc(s.nature || "")}${s.item ? " @" + esc(s.item) : ""} · ${esc(s.ability)}</span>
    <div class="mono muted">${esc((s.moves || []).join(", "))}</div></div>`).join("")}</div>`;
}

// ---------- matchup matrix (cell = hits we need / hits they need) ----------
const hits = k => k >= 99 ? "∞" : k > 9 ? "9+" : k;
function edge(p) { return Math.min(p.ko_us, 9) - Math.min(p.ko_them, 9) + (p.faster ? 0.5 : 0); }
function cellColor(e) {
  const k = Math.min(Math.abs(e) / 5, 1) * 85;
  return e === 0 ? "var(--mid)" : `color-mix(in oklab, ${e > 0 ? "var(--blue)" : "var(--red)"} ${k}%, var(--mid))`;
}
function matrixHTML(team, sets, matrix, enemy) {
  if (!matrix) return `<div class="muted small">no matrix in this event</div>`;
  const head = enemy.map(e => `<th class="e small"><b>${esc(e.species)}</b> L${e.level}<br><span class="muted">${esc(e.item || "–")} · ${esc(e.ability)}</span><br><span class="mono muted">${esc(e.moves.join(", "))}</span></th>`).join("");
  const safeBy = Object.fromEntries(enemy.map(e => [e.id, 0]));
  const rows = team.map((sp, i) => {
    const s = sets?.[i] || { species: sp }, row = matrix[sp] || {};
    const cells = enemy.map(e => {
      const p = row[e.id];
      if (!p) return `<td class="c muted">–</td>`;
      if (p.safe) safeBy[e.id]++;
      const ed = edge(p), dark = Math.abs(ed) >= 3;
      const tip = `${s.species} vs ${e.species}: we hit for ${pct(p.hit)} → ${p.ko_them >= 99 ? "never" : p.ko_them + " hits"}; they hit for ${pct(p.take)} → ${p.ko_us >= 99 ? "never" : p.ko_us + " hits"}; ${p.faster ? "we move first" : "they move first"}${p.heals ? "; they heal" : ""}${p.safe ? "; SAFE" : p.race ? "; race" : ""}`;
      return `<td class="c ${p.safe ? "safe" : p.race ? "race" : ""}" style="background:${cellColor(ed)};${dark ? "color:#fff" : ""}" title="${esc(tip)}">${p.safe ? "★" : ""}${hits(p.ko_them)}/${hits(p.ko_us)}${p.faster ? "›" : ""}${p.heals ? "h" : ""}</td>`;
    }).join("");
    return `<tr><th class="o"><b>${esc(s.species)}</b><br><span class="small muted">${esc(s.nature || "")} ${esc(s.ability || "")}</span><br><span class="small mono muted">${esc((s.moves || []).join(", "))}</span></th>${cells}</tr>`;
  }).join("");
  const foot = `<tr><th class="o small muted">safe answers</th>${enemy.map(e => `<td class="c small ${safeBy[e.id] ? "" : "down"}">${safeBy[e.id] || "none"}</td>`).join("")}</tr>`;
  return `<div class="legend"><span>cell = hits we need / hits they need (∞ never) · › we move first · h they heal</span>
    <span><i class="sw" style="background:${cellColor(-4)}"></i>they win the race</span><span><i class="sw" style="background:var(--mid)"></i>even</span>
    <span><i class="sw" style="background:${cellColor(4)}"></i>we win the race</span><span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--ink)"></i>★ safe</span>
    <span><i class="sw" style="box-shadow:inset 0 0 0 1px var(--ink-2)"></i>race</span></div>
    <div class="scroll" style="margin-top:8px"><table class="mx"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}${foot}</tbody></table></div>`;
}
function showMatrix(title, team, sets, matrix, enemy) {
  $("dlgt").textContent = title; $("dlgb").innerHTML = matrixHTML(team, sets, matrix, enemy); $("dlg").showModal();
}

// ---------- runs ----------
const CFG = ["legal", "arena", "repair", "matchup", "blind_field"];
function cfgChips(c) {
  const kv = [["chooser", c.chooser], ["death-weight", c.death_weight], ["n-search", c.n_search], ["search", c.search], ["seed", c.seed], ["workers", c.workers]];
  if (c.boxes) kv.unshift(["boxes", c.boxes]);
  return CFG.filter(k => c[k]).map(k => `<span class="chip">--${k.replace("_", "-")}</span>`).join("") + kv.map(([k, v]) => `<span class="chip">${k} ${esc(v)}</span>`).join("");
}
function bestTeam(b) {  // the probe's pick once the boss is done, the leader so far before
  const done = b.boss_done?.row.best_team?.join();
  return (done && b.teams.find(t => t.team.join() === done)) || b.teams.slice().sort((x, y) => y.win - x.win || x.deaths_per_mon - y.deaths_per_mon)[0];
}
function boxSummary(b) {
  if (b.boss_done) return b.boss_done.row;
  const bx = b.boxes, n = bx.length || 1;
  return bx.length ? { mean_win: bx.reduce((a, x) => a + x.win, 0) / n, p_clear: bx.filter(x => x.win >= .5).length / n,
    mean_deaths: bx.reduce((a, x) => a + x.deaths_per_mon, 0) / n, mean_deathless: bx.reduce((a, x) => a + x.deathless, 0) / n, missing: null } : null;
}
function headline(r) {
  return r.bosses.map(b => {
    const st = b.boss_failed ? " failed" : b.boss_done ? "" : " …";
    if (r.mode === "boxes") {
      const s = boxSummary(b);
      return `<span class="chip" title="mean win / boxes with a ≥50% team / deaths per mon / deathless">${esc(b.name)} ${s ? `${pct(s.mean_win)} · ${pct(s.p_clear)} · ${f2(s.mean_deaths)} · ${pct(s.mean_deathless)}` : "–"}${st}</span>`;
    }
    const t = b.boss_done?.row || bestTeam(b);
    return `<span class="chip" title="win / deaths per mon / deathless">${esc(b.name)} ${t ? `${pct(t.win)} · ${f2(t.deaths_per_mon)} · ${pct(t.deathless)}` : "–"}${st}</span>`;
  }).join("");
}
function gauntletCard(r) {
  const open = S.open.has(r.id), c = r.config, s = r.summary, n = r.slice || c.slice;
  const chips = [["enemy", c.enemy || "heuristic"], ["slice", c.slice], ["battler", c.policy || "SimpleHeuristics"], ["search", c.search], ["deep", c.deep],
    ["episodes", c.episodes], ["seed", c.seed], ["workers", c.workers]].filter(([, v]) => v != null).map(([k, v]) => `<span class="chip">${k} ${esc(v)}</span>`).join("")
    + (c.search_all ? `<span class="chip">--search-all</span>` : "");
  const head = s.cleared == null ? `<span class="muted small">no finished episode yet</span>` :
    `<span class="chip" title="mean trainers cleared">cleared ${s.cleared.toFixed(1)}/${n}</span><span class="chip" title="mean trainers cleared before the first death">no-death ${s.no_death.toFixed(1)}</span>
     <span class="chip">deaths/run ${f2(s.deaths)}</span><span class="chip">clear rate ${pct(s.clear)}</span>${s.final ? "" : `<span class="muted small">over ${r.episodes_done} finished</span>`}`;
  const body = open ? `<div class="body" style="display:grid;gap:14px">
    ${s.cleared == null ? "" : `<div class="stats"><div><div class="muted">trainers cleared</div><div class="big">${s.cleared.toFixed(1)} <span class="muted small">/ ${n}</span></div></div>
      <div><div class="muted">before first death</div><div class="big">${s.no_death.toFixed(1)}</div></div><div><div class="muted">deaths per run</div><div class="big">${f2(s.deaths)}</div></div>
      <div><div class="muted">runs cleared</div><div class="big">${pct(s.clear)}</div></div><div><div class="muted">episodes</div><div class="big">${r.episodes_done}/${r.n_episodes}</div></div></div>`}
    <div><h4>episodes · bar = progress, red = a death, grey lines = ${esc([...new Set(r.milestones.map(m => m[2].replace("_", " ")))].join(" / "))}</h4>${episodesHTML(r)}</div>
    <div class="cols"><div><h4>deadliest trainers</h4>${trainersHTML(r)}</div>
      <div><h4>deaths by species</h4>${r.species.length ? hbars(r.species.map(([sp, d]) => [sp, d, d]), r.species[0][1]) : `<span class="muted small">none yet</span>`}</div></div></div>` : "";
  return `<div class="card"><div class="head" data-act="toggle" data-key="${esc(r.id)}">
    <div class="row"><span class="name">${esc(r.id)}</span><span class="pill ${r.state}">${r.state}</span><span class="chip">BDSP gauntlet</span>
      <span class="muted small">started ${when(r.started)} · updated ${ago(r.updated)}${r.minutes ? ` · ${r.minutes} min` : ""}</span></div>
    <div class="row small">${chips}</div>
    <div class="row" style="align-items:center"><div style="flex:1;min-width:160px">${bar(r.n_episodes ? r.episodes_done / r.n_episodes : 0)}</div><span class="small mono">${r.episodes_done}/${r.n_episodes} episodes</span></div>
    <div class="row">${head}</div></div>${body}</div>`;
}
function episodesHTML(r) {
  const n = r.slice || 1, order = r.trainers;
  const ms = r.milestones.map(([i, name, b]) => `<i class="m" style="left:${i / n * 100}%" title="#${i} ${esc(name)} (${esc(b)})"></i>`).join("");
  const name = i => (r.milestones.find(m => m[0] === i) || [])[1];
  return `<div class="scroll"><table class="eps"><thead><tr><th class="n">seed</th><th style="width:60%">progress</th><th class="n">at</th><th class="n">deaths</th><th>state</th></tr></thead><tbody>
    ${r.episodes.map(ep => {
      const key = r.id + "|ep" + ep.seed, open = S.open.has(key), res = ep.result;
      const ticks = ep.deaths.map(([i, sp]) => `<i class="d" style="left:${(i + .5) / n * 100}%" title="#${i}: ${esc(sp)}"></i>`).join("");
      const st = res ? (res.clear ? `<span class="up">cleared</span>` : `<span class="down">ended at #${res.cleared}</span>`) : ep.at ? `<span class="muted">running</span>` : `<span class="muted">queued</span>`;
      const detail = open ? `<tr class="detail"><td colspan="5"><div class="small" style="display:grid;gap:6px">
        <div><b>party at the end</b> ${esc(ep.party.join(", ") || "–")}</div>
        ${(ep.traces || []).map(([i, f, won]) => `<div><button data-act="watch" data-href="replay?file=${esc(encodeURIComponent(f))}">▶ watch #${i} ${esc(name(i) || "")} (${won ? "won" : "lost"})</button></div>`).join("")}
        <div><b>deaths</b> ${ep.deaths.length ? ep.deaths.map(([i, sp]) => `${esc(sp)} <span class="muted">at #${i}${name(i) ? " " + esc(name(i)) : ""}</span>`).join(" · ") : "none"}</div></div></td></tr>` : "";
      const champ = (ep.traces || []).length ? ` <span title="champion fight recorded: open the episode to watch">▶</span>` : "";
      return `<tr class="click" data-act="toggle" data-key="${esc(key)}"><td class="n mono">${ep.seed}${champ}</td>
        <td><div class="strip"><i class="p ${res?.clear ? "clear" : ""}" style="width:${Math.min(1, ep.at / n) * 100}%"></i>${ms}${ticks}</div></td>
        <td class="n mono">${ep.at}</td><td class="n mono">${ep.deaths.length}</td><td class="small">${st}</td></tr>${detail}`;
    }).join("")}</tbody></table></div><div class="small muted">click an episode for its deaths and final party</div>`;
}
function trainersHTML(r) {
  const rows = r.trainers.filter(t => t.deaths || t.lost);
  if (!rows.length) return `<span class="muted small">no deaths yet</span>`;
  return `<div class="scroll"><table><thead><tr><th class="n">#</th><th>trainer</th><th>where</th><th class="n">deaths</th><th class="n">lost</th><th class="n">fought</th><th>our dead</th></tr></thead><tbody>

// ---------- compare ----------

}

          <td class="n">${f2(x.deaths_per_mon)}</td><td class="n">${f2(y.deaths_per_mon)}</td><td class="n">${delta(x.deaths_per_mon, y.deaths_per_mon, false, f2)}</td>
          <td class="n">${delta(x.deathless, y.deathless, true, pct)}</td><td class="small">${same ? `<span class="muted">same six</span>` : `A ${esc(x.sets.map(s => s.species).join(", "))}<br>B ${esc(y.sets.map(s => s.species).join(", "))}`}</td></tr>`;

  const watch = (turn, label) => t.log ? `<a href="replay?file=${encodeURIComponent(t.file)}${turn ? "&turn=" + turn : ""}" target="_blank" rel="noopener">${label}</a>` : "";
  const head = `<div class="row"><h3>${esc(t.boss)} · battle ${t.battle}</h3><span class="pill ${t.result.won ? "running" : "failed"}">${t.result.won ? "WIN" : "LOSS"}</span>
    ${t.log ? `<button data-act="watch" data-href="replay?file=${esc(encodeURIComponent(t.file))}">▶ watch in Showdown's viewer</button>` : `<span class="small muted">no log in this trace (re-run rr_trace.py --json to watch it)</span>`}

    <div class="row small muted" style="margin-top:2px">${esc(t.file)} · ${Object.entries(t.flags).map(([k, v]) => `${k} ${v}`).join(" · ")} · source ${esc(t.source || "--team")}</div>
    <div class="cols" style="margin-top:8px"><div><h4>ours</h4>${setHTML(t.ours)}</div><div><h4>theirs</h4>${setHTML(t.theirs)}</div></div>
    <button data-act="toggle" data-key="${esc(key)}" style="margin-top:10px">${open ? "▾ hide" : "▸ show"} turn by turn (${t.turns.length} steps${deaths ? `, ${deaths} deaths` : ""})</button>`;
  if (!open) return `<div class="panel" style="margin-bottom:12px">${head}</div>`;
  const turns = t.turns.map(x => {
    const cs = Object.entries(x.candidates).sort((a, b) => b[1] - a[1]), mx = Math.max(1e-9, ...cs.map(([, v]) => Math.abs(v)));
    const cand = cs.length ? `<div class="cand">${cs.map(([k, v]) => {
      const on = x.pick && (x.pick === k || x.pick.replace(/^\/choose /, "") === k);
      return `<span class="${on ? "pick" : ""}">${on ? "▶ " : ""}${esc(k.replace("move ", "").replace("switch ", "→ "))}</span><span class="neg">${v < 0 ? `<i style="width:${-v / mx * 100}%"></i>` : ""}</span><span class="pos">${v > 0 ? `<i style="width:${v / mx * 100}%"></i>` : ""}</span><span style="text-align:right" class="${on ? "pick" : ""}">${v >= 0 ? "+" : ""}${v.toFixed(2)}</span>`; }).join("")}</div>`
      : `<div class="small muted" style="margin-top:4px">${x.pick ? "pick " + esc(x.pick) + " (forced / only option)" : "no choice this step"}</div>`;
    const bench = x.bench.length || x.their_bench.length ? `<div class="row small muted" style="margin-top:4px;justify-content:space-between"><span>bench ${x.bench.map(p => `${esc(p.species)} ${pct(p.hp)}`).join(", ") || "–"}</span><span>${x.their_bench.map(p => `${esc(p.species)} ${pct(p.hp)}`).join(", ") || "–"}</span></div>` : "";
    return `<div class="turn ${x.deaths.length ? "death" : ""}"><div class="tno">T${x.turn}${x.turn ? `<div class="small">${watch(x.turn, "▶ watch")}</div>` : ""}</div><div><div class="act">${hpHTML(x.ours)}<span class="muted small">vs</span>${hpHTML(x.theirs, true)}</div>${bench}${cand}
      <div class="ev">${x.events.map(e => `<span class="${/^faint/.test(e) ? "f" : ""}">${esc(e)}</span>`).join("")}</div>
      ${x.deaths.length ? `<div class="small down" style="margin-top:4px">✝ ${esc(x.deaths.join(", "))} fainted</div>` : ""}</div></div>`;
  }).join("");
  return `<div class="panel" style="margin-bottom:12px">${head}<div style="margin-top:8px">${turns}</div>
    <button data-act="toggle" data-key="${esc(key)}" style="margin-top:10px">▴ hide turn by turn (${esc(t.boss)} · battle ${t.battle})</button></div>`;
}

// ---------- matrices ----------
function renderMatrices() {
  const ms = (S.data?.matrices || []).filter(d => S.hist || d.file.startsWith("logs/"));
  if (!ms.length) return `<div class="empty">No matrix files. <code>uv run python scripts/rr_matchups.py BROCK --team a,b,c --json</code> (or <code>--pool</code>) writes one; every team and box in a run carries its own (Runs → matrix).</div>`;
  const m = ms.find(x => x.file === S.matrix) || ms[0];
  const ar = Object.entries(m.arena || {}).filter(([k]) => k !== "ai_permanent").map(([k, v]) => `${k} ${v}`).join(", ");
  return `<div class="panel row" style="margin-bottom:12px"><select data-matrix>${ms.map(x => `<option value="${esc(x.file)}" ${x === m ? "selected" : ""}>${esc(x.boss)} · ${x.team.length} of ours (${esc(x.file)})</option>`).join("")}</select>
    <span class="small muted">cap ${m.cap} · arena ${esc(ar || "none")}</span></div><div class="panel">${matrixHTML(m.team, m.sets, m.matrix, m.enemy)}</div>`;
}

// ---------- shell ----------
const VIEWS = { runs: renderRuns, compare: renderCompare, deaths: renderDeaths, traces: renderTraces, matrices: renderMatrices };
function render() {
  $("tabs").innerHTML = TABS.map(([k, l]) => `<a href="#${k}" class="${tab() === k ? "on" : ""}">${l}</a>`).join("");
  if (S.data) $("main").innerHTML = (VIEWS[tab()] || renderRuns)();
}
async function load() {
  try {
    const r = await fetch("data.json?" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    S.data = await r.json();
    if (!S.cmp[0] && S.data.runs.length > 1) S.cmp = [S.data.runs[1].id, S.data.runs[0].id];
    const live = S.data.runs.filter(x => x.state === "running").length;
    $("stamp").textContent = `refreshed ${new Date().toLocaleTimeString()} · ${live} running · every 30 s`;
    render();
  } catch (e) {
    $("stamp").textContent = `data.json unavailable (${e.message}): run uv run python ui/build.py --serve`;
  }
}
document.addEventListener("click", e => {
  const s = e.target.closest("th[data-sort]");
  if (s) { const k = s.dataset.key, cur = S.sort[k] || { col: "i", dir: 1 }; S.sort[k] = { col: s.dataset.sort, dir: cur.col === s.dataset.sort ? -cur.dir : (s.dataset.sort === "i" ? 1 : -1) }; return render(); }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act === "close") return $("dlg").close();
  if (a.dataset.act === "watch") return window.open(a.dataset.href, "_blank", "noopener");
  if (a.dataset.act === "toggle") { S.open.has(a.dataset.key) ? S.open.delete(a.dataset.key) : S.open.add(a.dataset.key); return render(); }
  if (a.dataset.act === "mx-team") {
    e.stopPropagation();
    const [rid, boss] = a.dataset.key.split("|"), b = runById(rid).bosses.find(x => x.name === boss), t = b.teams[+a.dataset.i];
    showMatrix(`${boss} · ${t.label} · ${t.sets.map(s => s.species).join(", ")}`, t.team, t.sets, t.matrix, b.boss_start?.enemy || []);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "hist") { S.hist = e.target.checked; return render(); }
  if (e.target.dataset.cmp) { S.cmp[+e.target.dataset.cmp] = e.target.value || null; return render(); }
  if ("matrix" in e.target.dataset) { S.matrix = e.target.value; return render(); }
});
window.addEventListener("hashchange", render);
render(); load(); setInterval(load, 30000);
</script>
</body>
